<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MisterSmartyPants - A retrieval-augmented AI chat experiment.</title>
  <meta name="description" content="MisterSmartyPants is a retrieval-augmented AI chat experiment that combines local Ollama models, web search, article extraction, relevance ranking, and summarization.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://MisterSmartyPants.us/">
  <meta property="og:title" content="MisterSmartyPants">
  <meta property="og:description" content="A retrieval-augmented AI chat experiment using local models, search, extraction, ranking, and summarization.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://MisterSmartyPants.us/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MisterSmartyPants">
  <meta name="twitter:description" content="A retrieval-augmented AI chat experiment using local models, search, extraction, ranking, and summarization.">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#101214">
  <style>
    :root { color-scheme: light dark; font-family: Consolas, ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body { margin: 0; background: #101214; color: #e8e8e8; }
    main { width: 100%; max-width: 980px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 16px 18px; border-bottom: 1px solid #2b3035; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #log { padding: 16px 18px; overflow-y: auto; overflow-x: hidden; line-height: 1.45; }
    .turn { margin: 0 0 18px; }
    .user, .output, .status { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .user, .status { white-space: pre-wrap; }
    .user { color: #9fd3ff; }
    .speaker { color: #a7f3d0; margin-top: 4px; }
    .output { color: #e8e8e8; }
    .output > :first-child { margin-top: 0; }
    .output > :last-child { margin-bottom: 0; }
    .output p, .output ul, .output ol, .output blockquote, .output pre, .output table { margin: .7em 0; }
    .output strong { font-weight: 800; color: #ffffff; }
    .output em { font-style: italic; }
    .output ul, .output ol { padding-left: 1.7em; }
    .output li + li { margin-top: .25em; }
    .output a { color: #75b7ff; }
    .output blockquote { margin-left: 0; padding-left: .9em; border-left: 3px solid #4b5563; color: #c6cbd1; }
    .output code { padding: .12em .3em; border-radius: 4px; background: #1d2329; font: .9em Consolas, ui-monospace, monospace; }
    .output pre { padding: 12px; overflow-x: auto; border: 1px solid #30363d; border-radius: 6px; background: #161b22; }
    .output pre code { padding: 0; background: transparent; }
    .output table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    .output th, .output td { padding: .4em .65em; border: 1px solid #3b424a; text-align: left; }
    .output th { background: #1d2329; }
    .status { color: #8b949e; margin-top: 4px; min-height: 1.45em; }
    form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #2b3035; }
    textarea { flex: 1; min-height: 84px; max-height: 180px; resize: vertical; border: 1px solid #3b424a; border-radius: 6px; padding: 10px; background: #171a1d; color: #f4f4f4; font: inherit; }
    .unlock-entry { flex: 1; display: flex; align-items: center; min-height: 84px; border: 1px solid #3b424a; border-radius: 6px; padding: 10px; background: #171a1d; color: #9fd3ff; }
    .unlock-entry[hidden] { display: none; }
    .unlock-entry input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #f4f4f4; font: inherit; }
    button { border: 1px solid #3b424a; border-radius: 6px; padding: 0 16px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .passkey-controls { display: flex; gap: 8px; padding: 0 18px 12px; }
    .passkey-controls button { min-height: 36px; padding: 0 10px; background: #334155; font-size: 13px; }
    .reply-controls { display: flex; gap: 8px; margin-top: 8px; }
    .reply-controls button { min-height: 32px; padding: 0 10px; background: #1f6f43; font-size: 12px; }
    #restore-notice { margin: 12px 18px 0; padding: 10px; border: 1px solid #7c5c19; border-radius: 6px; background: #33280d; color: #fde68a; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header><h1>MisterSmartyPants</h1> - A retrieval-augmented AI chat experiment.<div style="font-size:12px;color:#8b949e;margin-top:4px">build 2026-06-06 async-jobs</div></header>
    <div id="restore-notice" hidden></div>
    <section id="log" aria-live="polite"></section>
    <form id="chat-form">
      <textarea id="message" placeholder="Search is ON. Ask something or use /?" autofocus></textarea>
      <label id="unlock-entry" class="unlock-entry" hidden><span id="unlock-prefix">/unlock&nbsp;</span><input id="unlock-password" type="password" autocomplete="current-password" aria-label="Unlock password" /></label>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="passkey-controls">
      <button id="passkey-unlock" type="button">Unlock with passkey</button>
      <button id="passkey-register" type="button">Add passkey</button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script>
    const form = document.getElementById('chat-form');
    const message = document.getElementById('message');
    const unlockEntry = document.getElementById('unlock-entry');
    const unlockPassword = document.getElementById('unlock-password');
    const unlockPrefix = document.getElementById('unlock-prefix');
    const log = document.getElementById('log');
    const send = document.getElementById('send');
    const passkeyUnlock = document.getElementById('passkey-unlock');
    const passkeyRegister = document.getElementById('passkey-register');
    const restoreNotice = document.getElementById('restore-notice');
    const TRANSCRIPT_STORAGE_KEY = 'msp-transcript-v1';
    const TRANSCRIPT_MAX_TURNS = 100;
    let transcript = [];
    let focusFollow = true;
    let searchMode = 'ON';
    let verboseMode = false;

    function updateMessagePlaceholder() {
      message.placeholder = `Search is ${searchMode}. Ask something or use /?`;
    }

    function updateSearchModeFromResponse(command, output) {
      const normalizedOutput = (output || '').trim();
      const commandResponses = {
        '/search-on': ['[System] Search enabled.', 'ON'],
        '/search-off': ['[System] Search disabled. Prompts will be sent directly to the LLM.', 'OFF'],
        '/search-force': ['[System] Search forced. Search decider will be bypassed.', 'FORCED'],
      };
      const expected = commandResponses[command];
      if (expected && normalizedOutput.includes(expected[0])) {
        searchMode = expected[1];
        updateMessagePlaceholder();
      }
      if (command.startsWith('/unlock') && normalizedOutput.includes('[System] Unlocked.')) {
        searchMode = 'ON';
        updateMessagePlaceholder();
      }
      if (command === '/new' && normalizedOutput.includes('[System] Context cleared.')) clearTranscript();
    }

    function updateVerboseModeFromResponse(command, output) {
      const normalizedOutput = (output || '').trim();
      if (command === '/verbose-on' && normalizedOutput.includes('[System] Verbose output enabled.')) verboseMode = true;
      if (command === '/verbose-off' && normalizedOutput.includes('[System] Verbose output disabled.')) verboseMode = false;
    }

    function unlockPasswordMode() {
      return !unlockEntry.hidden;
    }

    function showUnlockPasswordEntry(prefix) {
      unlockPrefix.textContent = prefix;
      message.hidden = true;
      unlockEntry.hidden = false;
      unlockPassword.value = '';
      unlockPassword.focus();
    }

    function hideUnlockPasswordEntry() {
      unlockEntry.hidden = true;
      message.hidden = false;
      unlockPassword.value = '';
    }

    function currentMessage() {
      return unlockPasswordMode() ? `${unlockPrefix.textContent}${unlockPassword.value}` : message.value;
    }

    function clearMessage() {
      message.value = '';
      hideUnlockPasswordEntry();
    }

    updateMessagePlaceholder();

    function saveTranscript() {
      try {
        localStorage.setItem(TRANSCRIPT_STORAGE_KEY, JSON.stringify(transcript.slice(-TRANSCRIPT_MAX_TURNS)));
      } catch (_) {
        // A full or unavailable browser store should not block chat.
      }
    }

    function appendTurn(input, output, forceScroll = false, persist = true) {
      const block = document.createElement('div');
      block.className = 'turn';
      const userLabel = verboseMode ? 'AI ready&gt;' : 'You&gt;';
      const assistantLabel = verboseMode ? '' : '<div class="speaker">Mr. Smarty Pants&gt;</div>';
      const copyable = isCopyableReply(output);
      block.innerHTML = `<div class="user">${userLabel} ${escapeHtml(displayInput(input))}</div>${assistantLabel}<div class="output">${renderOutputHtml(output)}</div><div class="reply-controls" ${copyable ? '' : 'hidden'}><button class="copy-formatted" type="button" ${copyable ? '' : 'disabled'}>Copy formatted</button><button class="share-html" type="button" ${copyable ? '' : 'disabled'}>Share HTML</button></div><div class="status"></div>`;
      const copyButton = block.querySelector('.copy-formatted');
      copyButton.addEventListener('click', () => copyFormattedReply(block, copyButton));
      const shareButton = block.querySelector('.share-html');
      shareButton.addEventListener('click', () => shareHtmlReply(block, shareButton));
      log.appendChild(block);
      if (persist) {
        transcript.push({input: displayInput(input), output: output || ''});
        saveTranscript();
      }
      scrollToBottom(forceScroll);
    }

    function updateLatestTranscript(output) {
      if (!transcript.length) return;
      transcript[transcript.length - 1].output = output || '';
      saveTranscript();
    }

    function isCopyableReply(output) {
      return Boolean(output && !output.startsWith('[System]'));
    }

    function updateCopyControl(turn, output, complete = false) {
      const controls = turn.querySelector('.reply-controls');
      const button = turn.querySelector('.copy-formatted');
      const shareButton = turn.querySelector('.share-html');
      if (!controls || !button || !shareButton) return;
      const copyable = isCopyableReply(output);
      controls.hidden = !copyable;
      button.disabled = !copyable || !complete;
      shareButton.disabled = !copyable || !complete;
    }

    function lightReplyHtml(replyHtml) {
      return `<div style="background:#ffffff;color:#111111;font-family:Arial,sans-serif;line-height:1.45"><style>code{background:#f3f4f6;color:#111111;padding:2px 4px;border-radius:3px}pre{background:#f3f4f6;color:#111111;padding:10px;border:1px solid #d1d5db}a{color:#1155cc}table{border-collapse:collapse}th,td{border:1px solid #9ca3af;padding:5px;color:#111111}th{background:#e5e7eb}</style>${replyHtml}</div>`;
    }

    async function copyFormattedReply(turn, button) {
      const output = turn.querySelector('.output');
      const replyHtml = output?.innerHTML || '';
      const plainText = output?.innerText || '';
      if (!replyHtml) return;
      const html = lightReplyHtml(replyHtml);
      button.disabled = true;
      try {
        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type: 'text/html'}),
              'text/plain': new Blob([plainText], {type: 'text/plain'}),
            })
          ]);
        } else {
          const staging = document.createElement('div');
          staging.contentEditable = 'true';
          staging.innerHTML = html;
          staging.style.cssText = 'position:fixed;left:-9999px;top:0;';
          document.body.appendChild(staging);
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(staging);
          selection.removeAllRanges();
          selection.addRange(range);
          const copied = document.execCommand('copy');
          selection.removeAllRanges();
          staging.remove();
          if (!copied) throw new Error('This browser cannot copy formatted content.');
        }
        button.textContent = 'Copied formatted';
        setTimeout(() => { button.textContent = 'Copy formatted'; button.disabled = false; }, 1600);
      } catch (err) {
        button.textContent = 'Copy formatted';
        button.disabled = false;
        window.alert(`Formatted copy failed: ${err.message || err}`);
      }
    }

    async function shareHtmlReply(turn, button) {
      const output = turn.querySelector('.output');
      const replyHtml = output?.innerHTML || '';
      if (!replyHtml) return;
      const documentHtml = `<!doctype html><html><head><meta charset="utf-8"><title>Mr. Smarty Pants reply</title></head><body>${lightReplyHtml(replyHtml)}</body></html>`;
      const file = new File([documentHtml], 'mister-smartypants-reply.html', {type: 'text/html'});
      if (!navigator.share || !navigator.canShare?.({files: [file]})) {
        window.alert('Sharing HTML files is not supported by this browser.');
        return;
      }
      button.disabled = true;
      try {
        await navigator.share({title: 'Mr. Smarty Pants reply', files: [file]});
      } catch (err) {
        if (err.name !== 'AbortError') window.alert(`Share failed: ${err.message || err}`);
      } finally {
        button.disabled = false;
      }
    }

    function clearTranscript() {
      transcript = [];
      try { localStorage.removeItem(TRANSCRIPT_STORAGE_KEY); } catch (_) {}
    }

    function showRestoreNotice(text) {
      restoreNotice.textContent = text;
      restoreNotice.hidden = false;
    }

    async function restoreTranscript() {
      try {
        const saved = JSON.parse(localStorage.getItem(TRANSCRIPT_STORAGE_KEY) || '[]');
        if (!Array.isArray(saved) || !saved.length) return;
        transcript = saved.slice(-TRANSCRIPT_MAX_TURNS).filter(turn =>
          turn && typeof turn.input === 'string' && typeof turn.output === 'string'
        );
        transcript.forEach(turn => appendTurn(turn.input, turn.output, false, false));
        showRestoreNotice('Restored messages are shown from this device while conversation context is checked.');
        const response = await fetch('/api/session');
        const state = await readJsonResponse(response);
        if (response.ok && state.has_server_context) {
          restoreNotice.hidden = true;
        } else {
          showRestoreNotice('Restored messages are for review only. The current server conversation has no prior context.');
        }
      } catch (_) {
        showRestoreNotice('Restored messages are for review only. The current server conversation could not be verified.');
      }
    }

    function appendSystem(text) {
      appendTurn(text, `[System] ${text === '/focus-on' ? 'Focus follow enabled.' : 'Focus follow disabled.'}`, true);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    function displayInput(text) {
      return /^\/unlock\s+\S+/i.test(text) ? text.replace(/^(\/unlock\s+).*/, '$1***') : text;
    }

    function renderOutputHtml(text) {
      const source = text || '';
      if (!window.marked || !window.DOMPurify) {
        return escapeHtml(source).replace(/\n/g, '<br>');
      }

      const rendered = window.marked.parse(source, { gfm: true, breaks: true });
      const sanitized = window.DOMPurify.sanitize(rendered, {
        ALLOWED_TAGS: [
          'a', 'blockquote', 'br', 'code', 'del', 'em', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
          'hr', 'li', 'ol', 'p', 'pre', 'strong', 'table', 'tbody', 'td', 'th', 'thead', 'tr', 'ul',
        ],
        ALLOWED_ATTR: ['href', 'title'],
      });
      const container = document.createElement('div');
      container.innerHTML = sanitized;
      container.querySelectorAll('a[href]').forEach(link => {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      });
      return container.innerHTML;
    }

    function waitForChatJob(jobId, onUpdate, onWorking) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let pollInFlight = false;
        let lastRecoveryPoll = 0;
        const eventSource = new EventSource(`/api/chat/${encodeURIComponent(jobId)}/events`);

        const cleanup = () => {
          settled = true;
          eventSource.close();
          clearInterval(fallbackPollTimer);
          clearInterval(workingTimer);
          window.removeEventListener('online', recoverNow);
        };
        const complete = data => {
          if (settled) return;
          cleanup();
          resolve(data);
        };
        const fail = error => {
          if (settled) return;
          cleanup();
          reject(error);
        };
        const processStatus = (response, data) => {
          if (!response.ok || data.error) {
            if (response.status === 404) fail(new Error(data.error || 'Chat job not found.'));
            return;
          }
          if (data.output) onUpdate(data.output);
          if (data.done) complete(data);
        };
        const poll = async () => {
          if (settled || pollInFlight) return;
          pollInFlight = true;
          try {
            const response = await fetch(`/api/chat/${encodeURIComponent(jobId)}`);
            processStatus(response, await readJsonResponse(response));
          } catch (_) {
            // SSE will reconnect automatically; leave the long fallback timer running.
          } finally {
            pollInFlight = false;
          }
        };
        const recoverNow = () => {
          const now = Date.now();
          if (now - lastRecoveryPoll < 1000) return;
          lastRecoveryPoll = now;
          void poll();
        };
        const fallbackPollTimer = setInterval(() => { void poll(); }, 60000);
        let workingDots = 0;
        const workingTimer = setInterval(() => {
          workingDots = (workingDots + 1) % 4;
          onWorking(workingDots);
        }, 1000);

        eventSource.addEventListener('complete', event => {
          try {
            complete(JSON.parse(event.data));
          } catch (_) {
            fail(new Error('Received an invalid chat completion event.'));
          }
        });
        eventSource.onerror = recoverNow;
        window.addEventListener('online', recoverNow);
      });
    }

    function scrollToBottom(force = false) {
      if (!force && !focusFollow) return;
      log.scrollTop = log.scrollHeight;
      form.scrollIntoView({block: 'end'});
    }

    async function readJsonResponse(res) {
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        return await res.json();
      }
      return {error: await res.text()};
    }

    function base64urlToBuffer(value) {
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const bytes = Uint8Array.from(atob(base64), char => char.charCodeAt(0));
      return bytes.buffer;
    }

    function bufferToBase64url(value) {
      const bytes = new Uint8Array(value);
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function preparePublicKeyOptions(options, registration) {
      const prepared = {...options, challenge: base64urlToBuffer(options.challenge)};
      if (registration) {
        prepared.user = {...options.user, id: base64urlToBuffer(options.user.id)};
        prepared.excludeCredentials = (options.excludeCredentials || []).map(item => ({...item, id: base64urlToBuffer(item.id)}));
      } else {
        prepared.allowCredentials = (options.allowCredentials || []).map(item => ({...item, id: base64urlToBuffer(item.id)}));
      }
      return prepared;
    }

    function serializeCredential(credential) {
      const response = credential.response;
      const data = {
        id: credential.id,
        rawId: bufferToBase64url(credential.rawId),
        type: credential.type,
        response: {clientDataJSON: bufferToBase64url(response.clientDataJSON)},
        clientExtensionResults: credential.getClientExtensionResults(),
      };
      if (response.attestationObject) {
        data.response.attestationObject = bufferToBase64url(response.attestationObject);
      } else {
        data.response.authenticatorData = bufferToBase64url(response.authenticatorData);
        data.response.signature = bufferToBase64url(response.signature);
        data.response.userHandle = response.userHandle ? bufferToBase64url(response.userHandle) : null;
      }
      return data;
    }

    async function passkeyRequest(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await readJsonResponse(res);
      if (!res.ok || data.detail || data.error) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
      return data;
    }

    async function usePasskey(kind) {
      if (!window.PublicKeyCredential) throw new Error('Passkeys are not supported by this browser.');
      const register = kind === 'register';
      const prefix = register ? '/api/passkey/register' : '/api/passkey/unlock';
      const options = await passkeyRequest(`${prefix}/options`);
      const credential = register
        ? await navigator.credentials.create({publicKey: preparePublicKeyOptions(options.publicKey, true)})
        : await navigator.credentials.get({publicKey: preparePublicKeyOptions(options.publicKey, false)});
      if (!credential) throw new Error('No passkey was selected.');
      await passkeyRequest(`${prefix}/verify`, {credential: serializeCredential(credential)});
      if (!register) {
        searchMode = 'ON';
        updateMessagePlaceholder();
      }
      appendTurn(register ? 'Add passkey' : 'Unlock with passkey', `[System] Passkey ${register ? 'registered.' : 'unlocked.'}`, true);
      message.focus();
    }

    passkeyUnlock.addEventListener('click', async () => {
      passkeyUnlock.disabled = true;
      try { await usePasskey('unlock'); } catch (err) { appendTurn('Unlock with passkey', `[System] ${err.message}`, true); }
      finally { passkeyUnlock.disabled = false; }
    });

    passkeyRegister.addEventListener('click', async () => {
      passkeyRegister.disabled = true;
      try { await usePasskey('register'); } catch (err) { appendTurn('Add passkey', `[System] ${err.message}`, true); }
      finally { passkeyRegister.disabled = false; }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = currentMessage().trim();
      if (!text) return;
      const lowerText = text.toLowerCase();
      clearMessage();
      if (lowerText === '/focus-off') {
        focusFollow = false;
        appendSystem(text);
        message.focus();
        return;
      }
      if (lowerText === '/focus-on') {
        focusFollow = true;
        appendSystem(text);
        scrollToBottom(true);
        message.focus();
        return;
      }
      send.disabled = true;
      appendTurn(text, '');
      const turn = log.lastElementChild;
      const current = turn.querySelector('.output');
      const statusLine = turn.querySelector('.status');
      statusLine.textContent = '[working]';
      scrollToBottom();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        const started = await readJsonResponse(res);
        if (!res.ok || started.error) {
          current.innerHTML = renderOutputHtml(started.output || started.error || `HTTP ${res.status}`);
          updateLatestTranscript(started.output || started.error || `HTTP ${res.status}`);
          statusLine.textContent = '';
          scrollToBottom();
          return;
        }
        if (started.done || !started.job_id) {
          current.innerHTML = renderOutputHtml(started.output || '');
          updateLatestTranscript(started.output || '');
          updateCopyControl(turn, started.output || '', true);
          updateSearchModeFromResponse(lowerText, started.output);
          updateVerboseModeFromResponse(lowerText, started.output);
          statusLine.textContent = '';
          scrollToBottom();
          return;
        }

        const data = await waitForChatJob(
          started.job_id,
          output => {
            current.innerHTML = renderOutputHtml(output);
            updateLatestTranscript(output);
            scrollToBottom();
          },
          dots => {
            statusLine.textContent = `[working${'.'.repeat(dots)}]`;
            scrollToBottom();
          },
        );
        if (data.error) throw new Error(data.error);
        current.innerHTML = renderOutputHtml(data.output || '');
        updateLatestTranscript(data.output || '');
        updateCopyControl(turn, data.output || '', true);
        updateSearchModeFromResponse(lowerText, data.output);
        updateVerboseModeFromResponse(lowerText, data.output);
        statusLine.textContent = '';
        scrollToBottom();
      } catch (err) {
        current.innerHTML = renderOutputHtml(String(err));
        updateLatestTranscript(String(err));
        statusLine.textContent = '';
        scrollToBottom();
      } finally {
        send.disabled = false;
        message.focus();
      }
    });

    message.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    message.addEventListener('input', () => {
      if (/^\/unlock\s+$/i.test(message.value)) {
        showUnlockPasswordEntry(message.value);
      }
    });

    unlockPassword.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        form.requestSubmit();
      }
      if (event.key === 'Escape' || (event.key === 'Backspace' && !unlockPassword.value)) {
        event.preventDefault();
        hideUnlockPasswordEntry();
        message.value = unlockPrefix.textContent;
        message.focus();
      }
    });

    restoreTranscript();
  </script>
</body>
</html>
