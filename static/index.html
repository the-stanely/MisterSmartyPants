<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MisterSmartyPants - A retrieval-augmented AI chat experiment.</title>
  <meta name="description" content="MisterSmartyPants is a retrieval-augmented AI chat experiment that combines local Ollama models, web search, article extraction, relevance ranking, and summarization.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://MisterSmartyPants.us/">
  <meta property="og:title" content="MisterSmartyPants">
  <meta property="og:description" content="A retrieval-augmented AI chat experiment using local models, search, extraction, ranking, and summarization.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://MisterSmartyPants.us/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MisterSmartyPants">
  <meta name="twitter:description" content="A retrieval-augmented AI chat experiment using local models, search, extraction, ranking, and summarization.">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light dark; font-family: Consolas, ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body { margin: 0; background: #101214; color: #e8e8e8; }
    main { width: 100%; max-width: 980px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { padding: 16px 18px; border-bottom: 1px solid #2b3035; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    #log { padding: 16px 18px; overflow-y: auto; overflow-x: hidden; white-space: pre-wrap; line-height: 1.45; }
    .turn { margin: 0 0 18px; }
    .user, .output, .status { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .user { color: #9fd3ff; }
    .output { color: #e8e8e8; }
    .status { color: #8b949e; margin-top: 4px; min-height: 1.45em; }
    form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #2b3035; }
    textarea { flex: 1; min-height: 84px; max-height: 180px; resize: vertical; border: 1px solid #3b424a; border-radius: 6px; padding: 10px; background: #171a1d; color: #f4f4f4; font: inherit; }
    button { border: 1px solid #3b424a; border-radius: 6px; padding: 0 16px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <header><h1>MisterSmartyPants</h1> - A retrieval-augmented AI chat experiment.<div style="font-size:12px;color:#8b949e;margin-top:4px">build 2026-06-06 async-jobs</div></header>
    <section id="log" aria-live="polite"></section>
    <form id="chat-form">
      <textarea id="message" placeholder="Search is OFF. Ask something or use /?" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.getElementById('chat-form');
    const message = document.getElementById('message');
    const log = document.getElementById('log');
    const send = document.getElementById('send');
    let focusFollow = true;
    let searchEnabled = false;

    function updateMessagePlaceholder() {
      message.placeholder = `Search is ${searchEnabled ? 'ON' : 'OFF'}. Ask something or use /?`;
    }

    updateMessagePlaceholder();

    function appendTurn(input, output, forceScroll = false) {
      const block = document.createElement('div');
      block.className = 'turn';
      block.innerHTML = `<div class="user">AI ready&gt; ${escapeHtml(input)}</div><div class="output">${escapeHtml(output)}</div><div class="status"></div>`;
      log.appendChild(block);
      scrollToBottom(forceScroll);
    }

    function appendSystem(text) {
      appendTurn(text, `[System] ${text === '/focus-on' ? 'Focus follow enabled.' : 'Focus follow disabled.'}`, true);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function scrollToBottom(force = false) {
      if (!force && !focusFollow) return;
      log.scrollTop = log.scrollHeight;
      form.scrollIntoView({block: 'end'});
    }

    async function readJsonResponse(res) {
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        return await res.json();
      }
      return {error: await res.text()};
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = message.value.trim();
      if (!text) return;
      message.value = '';
      if (text.toLowerCase() === '/focus-off') {
        focusFollow = false;
        appendSystem(text);
        message.focus();
        return;
      }
      if (text.toLowerCase() === '/focus-on') {
        focusFollow = true;
        appendSystem(text);
        scrollToBottom(true);
        message.focus();
        return;
      }
      if (text.toLowerCase() === '/search-on') {
        searchEnabled = true;
        updateMessagePlaceholder();
      }
      if (text.toLowerCase() === '/search-off') {
        searchEnabled = false;
        updateMessagePlaceholder();
      }
      send.disabled = true;
      appendTurn(text, '');
      const turn = log.lastElementChild;
      const current = turn.querySelector('.output');
      const statusLine = turn.querySelector('.status');
      statusLine.textContent = '[working]';
      scrollToBottom();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        const started = await readJsonResponse(res);
        if (!res.ok || started.error) {
          current.textContent = started.output || started.error || `HTTP ${res.status}`;
          statusLine.textContent = '';
          scrollToBottom();
          return;
        }
        if (started.done || !started.job_id) {
          current.textContent = started.output || '';
          statusLine.textContent = '';
          scrollToBottom();
          return;
        }

        let pollCount = 0;
        while (true) {
          await sleep(1000);
          pollCount += 1;
          statusLine.textContent = `[working${'.'.repeat(pollCount % 4)}]`;
          scrollToBottom();
          const pollRes = await fetch(`/api/chat/${encodeURIComponent(started.job_id)}`);
          const data = await readJsonResponse(pollRes);
          if (!pollRes.ok || data.error) {
            current.textContent = data.output || data.error || `HTTP ${pollRes.status}`;
            statusLine.textContent = '';
            scrollToBottom();
            return;
          }
          if (data.output) {
            current.textContent = data.output;
            scrollToBottom();
          }
          if (data.done) {
            current.textContent = data.output || '';
            statusLine.textContent = '';
            scrollToBottom();
            return;
          }
        }
      } catch (err) {
        current.textContent = String(err);
        statusLine.textContent = '';
        scrollToBottom();
      } finally {
        send.disabled = false;
        message.focus();
      }
    });

    message.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
